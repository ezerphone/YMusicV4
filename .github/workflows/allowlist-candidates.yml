name: allowlist-candidates

# Looks up the names in allowlist/names.txt on YouTube's channel search and commits the
# results (allowlist/candidates.tsv) back to this branch, to choose the allowlist from.
on:
  push:
    branches: [allowlist]
    paths: ['allowlist/names.txt', 'allowlist/resolve.py', '.github/workflows/allowlist-candidates.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade yt-dlp
      - run: python allowlist/resolve.py allowlist/names.txt allowlist/candidates.tsv
      - name: Commit the candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add allowlist/candidates.tsv
          git commit -m "allowlist: channel search results" || echo "no change"
          git push
